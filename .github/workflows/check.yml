name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Build and test on macOS
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
          swift format --version
      - name: Style, tests, and debug build
        run: make check
      - name: Package app
        run: make app
      - name: Verify installer boundaries
        run: make test-install
      - name: Archive app
        run: ditto -c -k --sequesterRsrc --keepParent dist/Still.app dist/Still-macOS.zip
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Still-macOS
          path: dist/Still-macOS.zip
          retention-days: 14
